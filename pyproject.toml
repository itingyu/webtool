[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webtool"
version = "1.5.6"
description = "Agent-friendly web search & content fetch CLI: clean markdown/text/json, ad-free, token-efficient, zero hard deps"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "itingyu"}]
keywords = ["agent", "web-scraping", "search", "markdown", "llm", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
full = ["trafilatura>=2.0", "readability-lxml", "html2text", "inscriptis", "pysocks", "curl_cffi>=0.16"]

[project.scripts]
webtool = "webtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
