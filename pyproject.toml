[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webtool"
version = "1.11.0"
description = "Agent-friendly web search & content fetch CLI: clean markdown/text/json output"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "itingyu"}]
keywords = ["agent", "web-scraping", "search", "markdown", "llm", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "trafilatura>=2.0",
    "readability-lxml",
    "html2text",
    "inscriptis",
    "pysocks",
    "curl_cffi>=0.16",
    "typer>=0.12",
    # 核心路径直接 import: core/tls.py 的 CA 探测最后一跳就是 certifi.where(),
    # 没它时 _probe_ca() 直接 ImportError (不是可选降级)。curl_cffi/requests 会
    # 顺带带进来, 但直接 import 的东西必须自己声明, 免得哪天上游不带了就炸。
    "certifi",
]

# 可选依赖: 缺了不影响核心抓取, 但对应的功能会明确报错而不是假实现
[project.optional-dependencies]
# 代理密码加密存储 (webtool proxy setpass); 不装则拒绝存密码, 不做 base64 假加密
secrets = ["cryptography>=41"]
# GeoIP ASN 查询 (规则里的 {"asn": [...]})
geoip = ["maxminddb>=2.4"]
# 股票能力。requests 是 stock/http.py 的**顶层** import (雪球会话走它,
# curl_cffi 过不了 hexin-v), 之前没声明 —— 装包后 `webtool stock` 直接
# ImportError, 而 stock 是延迟导入所以其他命令照常, 很难第一时间联想到。
# numpy / urllib3 / efinance 同理 (审计扫出 src 真实 import 但没声明):
#   numpy   — stock/engine/analysis/tech_indicators.py 顶层 import
#   urllib3 — stock/bridge/sources/_adapter.py 的 Retry, 函数内 import 但无兜底
#   efinance— stock/bridge/sources/ef.py 的东财源, try/except 守卫 (装了才启用)
stock = ["requests>=2.31", "pandas>=2.0", "numpy>=1.24", "urllib3>=2.0",
         "efinance>=0.5", "openpyxl>=3.1"]
# 全功能 (等价 `pip install webtool[secrets,geoip,stock]`)
full = ["cryptography>=41", "maxminddb>=2.4", "requests>=2.31", "pandas>=2.0",
        "numpy>=1.24", "urllib3>=2.0", "efinance>=0.5", "openpyxl>=3.1"]

[project.scripts]
webtool = "webtool.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 键是包名, 值是**相对该包根目录**的路径。所以 `data/*.json` 只覆盖
# webtool/data/, 覆盖不到 webtool/stock/data/ —— 实测 wheel 里 stock 的
# 11 个数据文件 (460KB: 7 本逆向文档 + em 配方 + 接口分类) 一个都没打进去,
# 装包后 `stock docs-*` / `em-*` 全废 (源码树里跑是好的, 所以本地测不出来)。
webtool = [
  "data/*.json",
  "data/**/*.json",
  "data/**/*.md",
  "stock/data/*.json",
  "stock/data/**/*.json",
  "stock/data/**/*.md",
  # engine/ 是纯代码包 (靠 __init__.py), 由 packages.find 自动收进 wheel,
  # 不必手写进 package-data —— 文档与自测脚本留在技能目录, 不随包分发。
]
