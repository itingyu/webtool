[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webtool"
version = "1.19.1"
description = "Agent-friendly web search & content fetch CLI: clean markdown/text/json output"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "itingyu"}]
keywords = ["agent", "web-scraping", "search", "markdown", "llm", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "trafilatura>=2.0",
    "readability-lxml",
    "html2text",
    "inscriptis",
    "pysocks",
    "curl_cffi>=0.16",
    "typer>=0.13",
    # typer 0.26 起 vendor 了自己的 click, 不再依赖顶层 click; 更早的 typer 才用它,
    # cli/app.py 的异常类导入会按 typer 版本二选一, 所以要自己声明
    "click>=8",
    # 核心路径直接 import: net/tls.py 的 CA 探测最后一跳就是 certifi.where(),
    # 没它时 _probe_ca() 直接 ImportError (不是可选降级)。curl_cffi/requests 会
    # 顺带带进来, 但直接 import 的东西必须自己声明, 免得哪天上游不带了就炸。
    "certifi",
    # ---- 以下原先是 extras, 现在一律随包安装: 全装是唯一形态 ----
    # 代理密码加密存储 (webtool proxy setpass); 没有它就只能拒绝存密码
    "cryptography>=41",
    # GeoIP ASN 查询 (规则里的 {"asn": [...]})
    "maxminddb>=2.4",
    # 股票能力。requests 是 stock/http.py 的**顶层** import (雪球会话走它,
    # curl_cffi 过不了 hexin-v)。numpy / urllib3 / efinance 同理 —— 审计扫出
    # src 真实 import: numpy 在 engine/analysis/tech_indicators.py 顶层,
    # urllib3 供 sources/_adapter.py 的 Retry, efinance 是东财源。
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "urllib3>=2.0",
    "efinance>=0.5",
    "openpyxl>=3.1",
    # `stock data` / `stock eco` 的默认库 (体积最大的一件, 但也在全装之内)
    "akshare>=1.12,<2",    # 终端图像渲染 (pic / banner --font big)。Pillow 只在函数内延迟 import,
    # 但 scripts/audit_deps.py 的规矩是延迟 import 也要声明。
    "pillow>=10",
]

[project.scripts]
webtool = "webtool.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 键是包名, 值是**相对该包根目录**的路径。所以 `data/*.json` 只覆盖
# webtool/data/, 覆盖不到 webtool/stock/data/ —— 实测 wheel 里 stock 的
# 11 个数据文件 (460KB: 7 本逆向文档 + em 配方 + 接口分类) 一个都没打进去,
# 装包后 `stock docs-*` / `em-*` 全废 (源码树里跑是好的, 所以本地测不出来)。
webtool = [
  "data/*.json",
  # banner --font big 的随包字体 (Noto Sans CJK SC 子集, 4736 字): 带上它,
  # 装完就能画汉字, PC 上也不必另配字体。许可原文是同目录的 *-OFL.md, 已随
  # data/**/*.md 打进去
  "data/*.otf",
  "data/**/*.json",
  "data/**/*.md",
  # 自带的 CA 包与站点专有证书 (data/certs/): 不带上的话 wheel 装完等于
  # 又回到"宿主没 ca-certificates 就不校验证书"——正是它们要解决的问题
  "data/certs/*.pem",
  "data/certs/**/*.pem",
  "data/certs/**/*.md",
  # geo 数据 (geosite/geoip): 随包分发一份基线, 首次运行由 bootstrap 落到
  # ~/.webtool/geo/, 规则 {geosite/geoip} 装完即用; `proxy geo update` 刷新用户态
  "data/geo/*.dat",
  "stock/data/*.json",
  "stock/data/**/*.json",
  "stock/data/**/*.md",
  # engine/ 是纯代码包 (靠 __init__.py), 由 packages.find 自动收进 wheel,
  # 不必手写进 package-data —— 文档与自测脚本留在技能目录, 不随包分发。
]
